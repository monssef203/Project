<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="4; url=https://019e9402-c788-79cf-9fd5-68e0305e1b63.arena.site/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monssef Perfumes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f9fa, #e9ecef, #dee2e6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #212529;
    }

    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.6);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(3, 105, 161, 0.15);
      max-width: 420px;
      width: 90%;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #0369a1;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #0284c7;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(to right, #38bdf8, #0369a1);
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    .message {
      font-size: 0.95rem;
      color: #0369a1;
      margin-bottom: 24px;
    }

    .loader {
      width: 100%;
      height: 4px;
      background: #e0f2fe;
      border-radius: 4px;
      overflow: hidden;
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #adb5bd, #0369a1);
      border-radius: 4px;
      animation: load 4s linear forwards;
    }

    @keyframes load {
      to { width: 100%; }
    }

    .by {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #ced4da;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🪻</div>
    <h1>Monssef</h1>
    <p class="subtitle">Perfumes</p>
    <div class="divider"></div>
    <p class="message">Bienvenue — Vous allez être redirigé...</p>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
    <p class="by">by Monssef ✦</p>
  </div>
</body>
</html>
